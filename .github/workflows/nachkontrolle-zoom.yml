name: Buchnachkontrolle - alle offenen Buchruecken vergroessern
on:
  push:
    branches: [main]
    paths:
      - "scripts/nachkontrolle_zoom.py"
      - ".github/workflows/nachkontrolle-zoom.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crops:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pillow installieren
        run: python -m pip install "Pillow>=10,<13"
      - name: Originalpixel aus vorhandenen SVG-Ausschnitten vergroessern
        run: python scripts/nachkontrolle_zoom.py
      - name: Bildausschnitte im Git sichern
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilder/nachkontrolle-zoom/ daten/nachkontrolle/zoom-b64/
          if ! git diff --staged --quiet; then
            git commit -m "Generate high-resolution rotated review crops for open books"
            git push
          fi
