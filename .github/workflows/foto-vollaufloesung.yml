name: Foto-Vollaufloesungs-Ausschnitte
on:
  push:
    branches: [main]
    paths:
      - "scripts/vollauflosung_crops.py"
      - "daten/bildanalyse/crop_queue.txt"
      - ".github/workflows/foto-vollaufloesung.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Pixelgenaue Ausschnitte aus Originalen (keine Originalaenderung)
        run: python scripts/vollauflosung_crops.py
      - name: Ausschnitte fuer Git-Audit synchronisieren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/bildanalyse/fullres/
          if ! git diff --staged --quiet; then
            git commit -m "Add native-resolution book-spine crops for audit"
            git push
          fi
