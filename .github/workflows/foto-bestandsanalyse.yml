name: Foto-Bestandsanalyse
on:
  push:
    branches: [main]
    paths:
      - "scripts/analyse_fotos.py"
      - ".github/workflows/foto-bestandsanalyse.yml"
      - "bilder/originale/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bildbibliothek einrichten
        run: python -m pip install "Pillow>=10,<13"
      - name: Fotos und Kontaktboegen analysieren
        run: python scripts/analyse_fotos.py
      - name: Ergebnisse versionieren und synchronisieren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/fotos.csv daten/bildanalyse/ daten/bildvorschau/ bilder/generiert/kontaktboegen/
          if ! git diff --staged --quiet; then
            git commit -m "Audit original images and add contact sheets"
            git push
          fi
